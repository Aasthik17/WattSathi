services:
  db:
    image: postgres:16-alpine
    container_name: wattsathi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wattsathi
      POSTGRES_USER: wattsathi
      POSTGRES_PASSWORD: wattsathi_dev_password
    ports:
      - "5432:5432"
    volumes:
      - wattsathi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wattsathi -d wattsathi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wattsathi_postgres_data:
